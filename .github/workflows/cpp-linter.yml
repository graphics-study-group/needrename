name: cpp-linter

on:
  pull_request:
    branches: [main, master, develop]
    paths: ['**.c', '**.cpp', '**.h', '**.hpp', '**.cxx', '**.hxx', '**.cc', '**.hh', '**CMakeLists.txt', 'meson.build', '**.cmake']
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  cpp-linter:
    runs-on: ubuntu-latest
    permissions: 
      pull-requests: write
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: file
          tidy-checks: '-*'
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' }}
          # Spit out why it is not formatted
          format-review: true
          passive-reviews: true
          # Large refactors can exceed GitHub's 300-file diff limit (API returns
          # 406), which makes the diff-based file list crash on deleted files.
          # Analyze the whole repository instead so the linter always runs.
          files-changed-only: false
          # Many directories do not have cpp files nonetheless.
          ignore: '.github | assets | builtin_assets | shader | third_party'

      # - name: Failed
      #   if: steps.linter.outputs.checks-failed != 0
      #   run: exit 1
